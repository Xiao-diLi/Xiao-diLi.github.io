<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">

<style>
  /* Bilingual logic */
  body.lang-zh .lang-en { display: none !important; }
  body:not(.lang-zh) .lang-zh { display: none !important; }

  /* Smooth Transitions for Layout and Themes */
  body, .masthead, .sidebar, .page, .archive__item, .btn, a, .pub-badge {
    transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease, box-shadow 0.3s ease, transform 0.2s ease;
  }
</style>
<script>
  function toggleLanguage() {
    var isZh = document.body.classList.toggle('lang-zh');
    localStorage.setItem('lang', isZh ? 'zh' : 'en');
  }
  document.addEventListener("DOMContentLoaded", function() {
    if (localStorage.getItem('lang') === 'zh') {
      document.body.classList.add('lang-zh');
    }
  });
</script>
